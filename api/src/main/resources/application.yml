server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 8h
      cookie:
        name: COTIZADOR_SESION
        http-only: true
        same-site: strict
        path: /

spring:
  application:
    name: cotizador-genomica

  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/cotizador_genomica?useUnicode=true&characterEncoding=utf8&serverTimezone=America/Bogota&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 8
      connection-init-sql: SET NAMES utf8mb4 COLLATE utf8mb4_0900_ai_ci

  flyway:
    enabled: true
    schemas: cotizador_genomica
    create-schemas: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  thymeleaf:
    cache: false
    mode: HTML

  mvc:
    async:
      request-timeout: 180000

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    enabled: ${OPENAPI_PUBLICO:false}
    path: /api-docs
  swagger-ui:
    enabled: ${OPENAPI_PUBLICO:false}
    path: /swagger-ui.html
    operations-sorter: method

app:
  empresa-nit: "901456789"
  correo-datos: "datos@genomicaandina.co"
  retefuente-pct: 4.00
  reteiva-pct: 0.00
  reteica-pct: 0.966
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  openapi-publico: ${OPENAPI_PUBLICO:false}
  asistente:
    url: ${FREELMAPI_URL:http://localhost:3001}
    api-key: ${FREELMAPI_KEY:}
    modelo: ${FREELMAPI_MODEL:auto}
    timeout-segundos: ${FREELMAPI_TIMEOUT:150}

logging:
  level:
    co.genomicaandina: INFO
